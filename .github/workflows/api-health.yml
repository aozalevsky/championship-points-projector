name: API health

on:
  schedule:
    - cron: '17 * * * *' # shallow checks, hourly
    - cron: '43 5 * * *' # deep data-integrity check, daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read # list this run's failed steps

concurrency:
  group: api-health
  cancel-in-progress: false

env:
  PROD_URL: https://cpp.aozalevsky.workers.dev
  SNAPSHOT_URL: https://raw.githubusercontent.com/aozalevsky/championship-points-projector/motogp-data

jobs:
  shallow:
    name: Shallow endpoint checks
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: App can load MotoGP data (worker proxy, else fresh snapshot)
        run: |
          year=$(date -u +%Y)
          if curl -fsS --max-time 30 "$PROD_URL/api/motogp/results/seasons" \
              | jq -e --argjson y "$year" 'any(.[]; .year == $y)' > /dev/null; then
            echo "proxy OK"
            exit 0
          fi
          echo "::warning::worker proxy for the motogp.com API is failing; checking the snapshot fallback"
          index=$(curl -fsS --max-time 30 "$SNAPSHOT_URL/index.json")
          age_h=$(( ($(date -u +%s) - $(date -u -d "$(jq -r .generatedAt <<< "$index")" +%s)) / 3600 ))
          echo "snapshot is ${age_h}h old"
          [ "$age_h" -le 12 ] || { echo "::error::snapshot older than 12h"; exit 1; }
          curl -fsS --max-time 30 "$SNAPSHOT_URL/motogp/$year.json" | jq -e '.drivers.segments | length > 0' > /dev/null
          echo "snapshot OK"

      - name: Upstream motogp.com API reachable (distinguishes API-down from proxy-broken)
        if: always()
        run: |
          year=$(date -u +%Y)
          curl -fsS --max-time 30 "https://api.motogp.pulselive.com/motogp/v1/results/seasons" \
            | jq -e --argjson y "$year" 'any(.[]; .year == $y)' > /dev/null
          echo "upstream OK"

      - name: Jolpica F1 API reachable
        if: always()
        run: |
          year=$(date -u +%Y)
          curl -fsS --max-time 30 "https://api.jolpi.ca/ergast/f1/$year.json" \
            | jq -e '.MRData.RaceTable.Races | length > 0' > /dev/null
          echo "jolpica OK"

      - name: Production site serves the app
        if: always()
        run: |
          curl -fsS --max-time 30 "$PROD_URL/" | grep -q "Championship Points Projector"
          echo "site OK"

  deep:
    name: Deep data-integrity check
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: F1 totals match official standings
        run: npm run verify -- $(date -u +%Y)
      - name: MotoGP totals match official standings
        if: always()
        run: npm run verify:moto -- motogp $(date -u +%Y)

  report:
    name: Open, update or close the health issue
    needs: [shallow, deep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Sync issue with check results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/health-report.sh
